name: Contribution arcade (Pac-Man and Snake)

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Both steps write into ./dist, which is then published to the "output" branch in one push.
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d9481c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff6a3d

      - name: List generated files
        run: ls -la dist

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
