name: Profile stats

on:
  schedule:
    - cron: "15 1 * * *"   # daily, 01:15 UTC
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the stats card
        run: python3 scripts/build_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "chore: refresh profile stats" || exit 0
          git pull --rebase
          git push
