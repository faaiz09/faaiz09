name: Rebuild artwork

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["scripts/build_assets.py"]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the animated SVGs
        run: python3 scripts/build_assets.py
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets
          git commit -m "chore: rebuild artwork" || exit 0
          git pull --rebase
          git push
